<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简历工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236366f1'/%3E%3Cpath d='M20 18h17l9 9v19a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z' fill='%23fff'/%3E%3Cpath d='M24 34h16M24 41h11' stroke='%236366f1' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  // 尽早应用主题，避免闪烁
  (function () {
    var t = localStorage.getItem('rp-theme') || 'auto';
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></div>
      <div class="brand-text"><b>简历工作台</b><span>Resume Agent</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <a class="llm-pill" id="llm-pill" href="#/settings"><i></i><span>检测中…</span></a>
      <div class="theme-switch" id="theme-switch">
        <button data-theme="light" title="浅色"></button>
        <button data-theme="auto" title="跟随系统"></button>
        <button data-theme="dark" title="深色"></button>
      </div>
    </div>
  </aside>
  <main class="main-area" id="view"></main>
</div>
<div id="toasts"></div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
